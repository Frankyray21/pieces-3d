<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pièces 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<!--APP-->
<div class="shell" id="shell">
  <header class="topbar">
    <button class="brand" id="brand" type="button" title="Catalogue des équipements">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.6 3.7L12 11.7 5.4 8 12 4.3ZM5 9.7l6 3.4v6.6l-6-3.3V9.7Zm8 10v-6.6l6-3.4v6.7l-6 3.3Z"/></svg>
      <span>Pièces 3D</span>
    </button>
    <div class="search">
      <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5.6 5.6"/></svg>
      <label class="sr" for="q">Rechercher une pièce</label>
      <input id="q" type="search" autocomplete="off" placeholder="N° de pièce ou description (ex. 2717074, roller)">
    </div>
    <!-- Emplacement des fonctions (ctx.ui.searchSlot) : filtres, boutons de recherche. -->
    <div class="search-slot" id="searchslot"></div>
  </header>

  <main class="workspace" id="workspace" data-pane="stage">
    <nav class="rail pane" id="rail" aria-label="Assemblages"></nav>

    <section class="stage pane" id="stage">
      <div class="viewport" id="viewport"></div>
      <div class="docview" id="docview" hidden></div>
      <div class="tools" id="tools">
        <div class="explode">
          <button type="button" class="tbtn" id="btn-assemble" title="Tout rassembler">Assembler</button>
          <label class="sr" for="explode">Éclatement de l'assemblage affiché</label>
          <input id="explode" type="range" min="0" max="100" value="0">
          <button type="button" class="tbtn" id="btn-explode" title="Éclater l'assemblage affiché">Éclater</button>
          <button type="button" class="tbtn strong" id="btn-explode-all" title="Éclater chaque groupe jusqu'au plus petit ensemble">Tout éclater</button>
        </div>
        <div class="tgroup">
          <button type="button" class="tbtn" id="btn-steps" aria-pressed="false" title="Voir le montage étape par étape" hidden>Montage</button>
          <button type="button" class="tbtn" id="btn-section" aria-pressed="false" title="Vue en coupe">Coupe</button>
          <button type="button" class="tbtn" id="btn-labels" aria-pressed="true" title="Afficher les repères du manuel">Repères</button>
          <button type="button" class="tbtn" id="btn-edges" aria-pressed="false" title="Afficher les contours des pièces, comme les traits du dessin">Contours</button>
          <button type="button" class="tbtn" id="btn-isolate" aria-pressed="false" title="Estomper les autres pièces">Isoler</button>
          <button type="button" class="tbtn" id="btn-frame" title="Recadrer">Recadrer</button>
          <button type="button" class="tbtn" id="btn-page" title="Voir la page du manuel">Page du manuel</button>
          <button type="button" class="tbtn" id="btn-full" aria-pressed="false" title="Afficher la vue 3D en plein écran">Plein écran</button>
          <!-- Outils ajoutés par les fonctions (ctx.ui.addTool), après un séparateur. -->
        </div>
        <div class="sectionbar" id="sectionbar" hidden>
          <span class="lbl">Plan de coupe</span>
          <div class="seg" role="group" aria-label="Orientation du plan de coupe">
            <button type="button" class="tbtn" data-axis="x" aria-pressed="false">Longueur</button>
            <button type="button" class="tbtn" data-axis="z" aria-pressed="true">Largeur</button>
            <button type="button" class="tbtn" data-axis="y" aria-pressed="false">Hauteur</button>
          </div>
          <label class="sr" for="secpos">Position du plan de coupe</label>
          <input id="secpos" type="range" min="2" max="98" value="50">
          <button type="button" class="tbtn" id="sec-flip">Inverser</button>
          <button type="button" class="tbtn" id="sec-scope" aria-pressed="false" title="Couper seulement la pièce ou le groupe sélectionné">Pièce sélectionnée</button>
        </div>
      </div>
      <p class="hint" id="hint">Clic : identifier une pièce · double-clic sur un groupe : l'éclater sur place · glisser : tourner · clic droit : déplacer</p>
      <div class="stepsbar" id="stepsbar" hidden>
        <div class="st-head">
          <button type="button" class="tbtn" id="st-prev" title="Étape précédente" aria-label="Étape précédente">◀</button>
          <span class="st-num" id="st-num"></span>
          <button type="button" class="tbtn" id="st-next" title="Étape suivante" aria-label="Étape suivante">▶</button>
          <button type="button" class="tbtn" id="st-replay" title="Rejouer la pose de cette étape" aria-label="Rejouer l'étape">↻</button>
          <label class="sr" for="st-range">Étape du montage</label>
          <input id="st-range" type="range" min="0" max="18" value="0">
          <button type="button" class="tbtn" id="st-play" aria-pressed="false" title="Lecture automatique">Lecture</button>
          <button type="button" class="tbtn" id="st-close" title="Fermer le montage (tout afficher)" aria-label="Fermer le montage">✕</button>
        </div>
        <strong class="st-title" id="st-title"></strong>
        <p class="st-text" id="st-text"></p>
        <button type="button" class="lnk st-page" id="st-page"></button>
      </div>
      <div class="titleblock" id="titleblock"></div>
      <div class="loading" id="loading" hidden>Construction du modèle…</div>
      <div class="loading-detail" id="loadingDetail" hidden>Chargement des détails…</div>
      <!-- Panneau latéral droit des fonctions (ctx.ui.sidePanel). -->
      <aside class="sidepanel" id="sidepanel" hidden aria-label="Panneau latéral">
        <div class="sp-head">
          <button type="button" class="sp-back" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span></span></button>
          <span class="sp-icon"></span><strong class="sp-title"></strong>
          <button type="button" class="sp-close" title="Replier le panneau" aria-label="Replier le panneau"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div class="sp-body"></div>
      </aside>
    </section>

    <aside class="panel pane" id="panel" aria-label="Pièces"></aside>

    <!-- Page plein écran sur l'espace de travail (page d'équipement, ctx.ui.showPage). -->
    <section class="wpage" id="wpage" hidden>
      <div class="wp-bar">
        <button type="button" class="wp-close btn" title="Fermer la page (Échap)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span>Retour</span></button>
        <span class="wp-icon"></span><h1 class="wp-title"></h1>
      </div>
      <div class="wp-body"></div>
    </section>
  </main>

  <nav class="mtabs" id="mtabs" aria-label="Sections">
    <button type="button" data-pane="rail">Assemblages</button>
    <button type="button" data-pane="stage" class="on">Vue</button>
    <button type="button" data-pane="panel">Pièces</button>
  </nav>
</div>

<section class="catalogue" id="catalogue" hidden></section>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<!--/APP-->
<script type="module" src="/src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pièces 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<!--APP-->
<div class="shell" id="shell">
  <header class="topbar">
    <button class="brand" id="brand" type="button" title="Catalogue des équipements">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.6 3.7L12 11.7 5.4 8 12 4.3ZM5 9.7l6 3.4v6.6l-6-3.3V9.7Zm8 10v-6.6l6-3.4v6.7l-6 3.3Z"/></svg>
      <span>Pièces 3D</span>
    </button>
    <nav class="crumbs" id="crumbs" aria-label="Fil d'Ariane"></nav>
    <div class="search">
      <label class="sr" for="q">Rechercher une pièce</label>
      <input id="q" type="search" autocomplete="off" placeholder="N° de pièce ou description (ex. 2717074, roller)">
      <div class="results" id="results" hidden></div>
    </div>
  </header>

  <main class="workspace" id="workspace" data-pane="stage">
    <nav class="rail pane" id="rail" aria-label="Assemblages"></nav>

    <section class="stage pane" id="stage">
      <div class="viewport" id="viewport"></div>
      <div class="docview" id="docview" hidden></div>
      <div class="tools" id="tools">
        <div class="explode">
          <button type="button" class="tbtn" id="btn-assemble" title="Tout rassembler">Assembler</button>
          <label class="sr" for="explode">Éclatement de l'assemblage affiché</label>
          <input id="explode" type="range" min="0" max="100" value="0">
          <button type="button" class="tbtn" id="btn-explode" title="Éclater l'assemblage affiché">Éclater</button>
          <button type="button" class="tbtn strong" id="btn-explode-all" title="Éclater chaque groupe jusqu'au plus petit ensemble">Tout éclater</button>
        </div>
        <div class="tgroup">
          <button type="button" class="tbtn" id="btn-section" aria-pressed="false" title="Vue en coupe">Coupe</button>
          <button type="button" class="tbtn" id="btn-labels" aria-pressed="true" title="Afficher les repères du manuel">Repères</button>
          <button type="button" class="tbtn" id="btn-isolate" aria-pressed="false" title="Estomper les autres pièces">Isoler</button>
          <button type="button" class="tbtn" id="btn-frame" title="Recadrer">Recadrer</button>
          <button type="button" class="tbtn" id="btn-page" title="Voir la page du manuel">Page du manuel</button>
        </div>
        <div class="sectionbar" id="sectionbar" hidden>
          <span class="lbl">Plan de coupe</span>
          <div class="seg" role="group" aria-label="Orientation du plan de coupe">
            <button type="button" class="tbtn" data-axis="x" aria-pressed="false">Longueur</button>
            <button type="button" class="tbtn" data-axis="z" aria-pressed="true">Largeur</button>
            <button type="button" class="tbtn" data-axis="y" aria-pressed="false">Hauteur</button>
          </div>
          <label class="sr" for="secpos">Position du plan de coupe</label>
          <input id="secpos" type="range" min="2" max="98" value="50">
          <button type="button" class="tbtn" id="sec-flip">Inverser</button>
          <button type="button" class="tbtn" id="sec-scope" aria-pressed="false" title="Couper seulement la pièce ou le groupe sélectionné">Pièce sélectionnée</button>
        </div>
      </div>
      <p class="hint" id="hint">Clic : identifier une pièce · double-clic sur un groupe : l'éclater sur place · glisser : tourner · clic droit : déplacer</p>
      <div class="titleblock" id="titleblock"></div>
      <div class="loading" id="loading" hidden>Construction du modèle…</div>
    </section>

    <aside class="panel pane" id="panel" aria-label="Pièces"></aside>
  </main>

  <nav class="mtabs" id="mtabs" aria-label="Sections">
    <button type="button" data-pane="rail">Assemblages</button>
    <button type="button" data-pane="stage" class="on">Vue</button>
    <button type="button" data-pane="panel">Pièces</button>
  </nav>
</div>

<section class="catalogue" id="catalogue" hidden></section>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<!--/APP-->
<script type="module" src="/src/main.js"></script>
</body>
</html>

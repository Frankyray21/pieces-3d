<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffre ITH — essai interactif</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8a939c; font: 15px/1.4 system-ui, sans-serif; color: #14181c; }
  canvas { display: block; touch-action: none; }
  #panneau { position: fixed; left: 12px; top: 12px; max-width: min(340px, calc(100vw - 24px)); background: #ffffffe6; border-radius: 10px; padding: 12px 14px; box-shadow: 0 2px 10px #0003; }
  #panneau h1 { font-size: 16px; margin: 0 0 4px; }
  #panneau p { margin: 0 0 8px; }
  #boutons { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #9aa3ab; border-radius: 6px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: #b5121a; border-color: #b5121a; color: #fff; }
  #etat { margin-top: 8px; font-size: 13px; color: #444; min-height: 1.4em; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.min.js",
  "three/addons/": "./lib/"
} }
</script>
</head>
<body>
<div id="panneau">
  <h1>Coffre à outils ITH — essai interactif</h1>
  <p>Cliquez sur la barre, une porte ou le tiroir, ou servez-vous des boutons. Glissez pour tourner, molette pour le zoom.</p>
  <div id="boutons"></div>
  <div id="etat">Chargement…</div>
</div>
<script type="module">
// Essai du fichier coffre-ith.glb tel qu'il est exporté pour un moteur de jeu :
// chaque élément mobile tourne ou glisse autour de sa propre origine, avec les
// valeurs inscrites dans les « extras » du fichier (mouvement, axe, angle, course).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8a939c);
scene.add(new THREE.HemisphereLight(0xffffff, 0x50555a, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(2.5, 4, 5);
scene.add(sun);
const grid = new THREE.GridHelper(8, 16, 0x6c747c, 0x7b848c);
scene.add(grid);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 60);
camera.position.set(2.2, 2.0, 3.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.52;

const NOMS = { SM_Coffre_Barre: 'Barre', SM_Coffre_Porte_G: 'Porte gauche', SM_Coffre_Porte_D: 'Porte droite', SM_Coffre_Tiroir: 'Tiroir' };
const ORDRE = Object.keys(NOMS);
const mobiles = new Map(); // nom → { node, base, cible (0-1), t (0-1), bouton }
const etat = document.querySelector('#etat');
const dire = (texte) => { etat.textContent = texte; };

/** Ce qui empêche le mouvement demandé, ou '' si rien. */
function blocage(nom, ouvrir) {
  const ouvert = (n) => mobiles.get(n).cible > 0;
  if (nom.startsWith('SM_Coffre_Porte') && ouvrir && !ouvert('SM_Coffre_Barre')) return 'Relevez d\'abord la barre de verrouillage.';
  if (nom === 'SM_Coffre_Tiroir' && ouvrir && !(ouvert('SM_Coffre_Porte_G') && ouvert('SM_Coffre_Porte_D'))) return 'Ouvrez d\'abord les deux portes.';
  if (nom.startsWith('SM_Coffre_Porte') && !ouvrir && ouvert('SM_Coffre_Tiroir')) return 'Refermez d\'abord le tiroir.';
  if (nom === 'SM_Coffre_Barre' && !ouvrir && !(mobiles.get('SM_Coffre_Porte_G').t === 0 && mobiles.get('SM_Coffre_Porte_D').t === 0)) return 'Fermez d\'abord les deux portes.';
  return '';
}

function basculer(nom) {
  const m = mobiles.get(nom);
  const ouvrir = m.cible === 0;
  const raison = blocage(nom, ouvrir);
  if (raison) return dire(raison);
  m.cible = ouvrir ? 1 : 0;
  m.bouton.setAttribute('aria-pressed', String(ouvrir));
  dire(`${NOMS[nom]} : ${ouvrir ? 'ouverture' : 'fermeture'}`);
}

new GLTFLoader().load('./coffre-ith.glb', (gltf) => {
  scene.add(gltf.scene);
  gltf.scene.traverse((o) => {
    if (!o.userData.mouvement) return;
    mobiles.set(o.name, { node: o, base: { rot: o.rotation.y, pos: o.position.z }, cible: 0, t: 0 });
  });
  for (const nom of ORDRE) {
    const b = document.createElement('button');
    b.textContent = NOMS[nom];
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => basculer(nom);
    mobiles.get(nom).bouton = b;
    document.querySelector('#boutons').appendChild(b);
  }
  dire('Prêt. Commencez par la barre de verrouillage.');
  window.coffre = { mobiles, basculer }; // pour les essais automatisés
}, undefined, (e) => dire(`Le fichier coffre-ith.glb ne se charge pas : ${e.message || e}`));

// Clic sur un élément mobile (sans confondre avec un glissement de caméra).
const ray = new THREE.Raycaster();
let appui = null;
renderer.domElement.addEventListener('pointerdown', (e) => { appui = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!appui || Math.hypot(e.clientX - appui[0], e.clientY - appui[1]) > 6 || !mobiles.size) return;
  ray.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const touche = ray.intersectObjects(scene.children, true).find((h) => h.object.isMesh);
  for (let o = touche?.object; o; o = o.parent) if (mobiles.has(o.name)) return basculer(o.name);
});

function taille() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', taille);
taille();

const horloge = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(horloge.getDelta(), 0.05);
  for (const m of mobiles.values()) {
    m.t = THREE.MathUtils.clamp(m.t + Math.sign(m.cible - m.t) * dt / 0.9, 0, 1);
    const k = m.t * m.t * (3 - 2 * m.t); // départ et arrivée en douceur
    const e = m.node.userData;
    if (e.mouvement === 'rotation') m.node.rotation.y = m.base.rot + THREE.MathUtils.degToRad(e.angle_ouvert_deg) * k;
    else m.node.position.z = m.base.pos + e.course_m * k;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
